<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faust · Agent Center</title>
    <meta name="description" content="Faust Agent Center — 面向 Spring AI 的可视化 Agent 编排与对话控制台" />
    <meta name="theme-color" content="#0b0a14" />

    <!-- 站点图标：SVG 优先（Chrome / Edge / Firefox），PNG 兜底（Safari、iOS 主屏） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- 首帧前应用已保存的主题，避免明暗闪烁 -->
    <script>
      try {
        if (window.localStorage.getItem('faust.theme') === 'light') {
          document.documentElement.classList.remove('dark');
        }
      } catch (error) {
        /* localStorage 不可用时保持默认深色 */
      }
    </script>

    <!--
      字体为非阻塞加载：即使网络不可达（如内网环境），
      也会优雅回落到 SF Pro Display / PingFang SC，不阻塞首屏渲染。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
