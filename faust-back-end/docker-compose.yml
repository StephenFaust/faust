services:
  mysql:
    image: mysql:8.0
    container_name: faust-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: faust_agent_center
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动建库建表
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: faust-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 可选：连同后端服务一起跑。单独启动用 `docker compose --profile app up -d`
  app:
    build: .
    profiles: ["app"]
    container_name: faust-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 容器内需用服务名访问，覆盖 .env 里的 localhost
      MYSQL_URL: 'jdbc:mysql://mysql:3306/faust_agent_center?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowMultiQueries=true'
      REDIS_HOST: redis
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "${SERVER_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 可选：本地对象存储。启用后把 S3_ENDPOINT 指向 http://localhost:9000
  # minio:
  #   image: minio/minio:latest
  #   container_name: faust-minio
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
  #     MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio-data:/data

volumes:
  mysql-data:
  redis-data:
  # minio-data:
